<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<div style="height:844px;max-height:844px;display:flex;flex-direction:column;position:relative;font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--page,#FAFAF8);color:var(--text,#1C1C1A);font-feature-settings:'tnum' 1;{{ vars }}">
<div style="position:absolute;top:0;left:0;right:0;height:62px;background:var(--page,#FAFAF8);z-index:5"></div>

<div style="flex:1;min-height:0;overflow:hidden;padding-top:62px;margin-top:var(--off,0px)">
<div style="padding:4px 20px 0;display:flex;align-items:flex-end;justify-content:space-between">
<span style="font-size:28px;font-weight:600;letter-spacing:-.02em">Progress</span>
<span style="font-size:13px;font-weight:500;color:var(--muted,#6B6B66)">Week 8 · 8 Nov 2026</span>
</div>

<div style="margin:12px 16px 0;background:var(--card,#fff);border:1px solid var(--line,#E6E5E0);border-radius:18px;padding:16px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
<div>
<span style="font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted,#6B6B66)">Current weight</span>
<div style="display:flex;align-items:baseline;gap:7px;margin-top:2px">
<span style="font-size:54px;font-weight:600;line-height:1;letter-spacing:-.04em">152.2</span>
<span style="font-size:18px;font-weight:500;color:var(--muted,#6B6B66)">kg</span>
</div>
<span style="font-size:14px;font-weight:500;color:var(--greenText,#3E7057)">↓ 0.3 kg since yesterday</span>
</div>
<svg viewBox="0 0 104 44" style="width:104px;height:44px;flex:none;margin-bottom:4px">
<path d="{{ sparkPath }}" fill="none" stroke="var(--accent,#2F6C7A)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"></path>
</svg>
</div>

<div style="margin:8px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px">
<sc-for list="{{ stats }}" as="s" hint-placeholder-count="6">
<div style="background:var(--card,#fff);border:1px solid var(--line,#E6E5E0);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:2px">
<span style="font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted,#6B6B66)">{{ s.label }}</span>
<div style="display:flex;align-items:baseline;gap:4px">
<span style="font-size:21px;font-weight:600;letter-spacing:-.02em;color:{{ s.color }}">{{ s.value }}</span>
<span style="font-size:11px;font-weight:500;color:var(--muted,#6B6B66)">{{ s.unit }}</span>
</div>
<span style="font-size:10.5px;font-weight:500;color:var(--muted,#6B6B66)">{{ s.sub }}</span>
</div>
</sc-for>
</div>

<div style="margin:8px 16px 0;background:var(--card,#fff);border:1px solid var(--line,#E6E5E0);border-radius:14px;padding:12px 13px 13px">
<div style="display:flex;align-items:baseline;justify-content:space-between">
<span style="font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted,#6B6B66);white-space:nowrap">Goal completion</span>
<span style="font-size:12px;font-weight:600;color:var(--greenText,#3E7057)">8% · 4.8 of 57.0 kg</span>
</div>
<div style="height:8px;border-radius:99px;background:var(--rail,#EFEEE9);margin-top:9px;overflow:hidden">
<div style="height:100%;width:8.4%;border-radius:99px;background:var(--green,#4F8A6B)"></div>
</div>
</div>

<div style="margin:8px 16px 0;background:var(--card,#fff);border:1px solid var(--line,#E6E5E0);border-radius:18px;padding:14px 14px 12px">
<div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 2px">
<span style="font-size:13px;font-weight:600">Weight trend</span>
<span style="font-size:11px;font-weight:500;color:var(--muted,#6B6B66)">8 weeks · 13 Sept – 8 Nov</span>
</div>
<div style="position:relative;margin-top:10px">
<sc-for list="{{ yLabels }}" as="l" hint-placeholder-count="4">
<div style="position:absolute;left:0;top:{{ l.top }};font-size:9px;font-weight:500;color:var(--muted,#6B6B66)">{{ l.label }}</div>
</sc-for>
<svg viewBox="0 0 330 168" style="width:100%;height:168px;display:block">
<sc-for list="{{ gridLines }}" as="g" hint-placeholder-count="4">
<line x1="26" y1="{{ g.y }}" x2="328" y2="{{ g.y }}" stroke="var(--line,#E6E5E0)" strokeWidth="1"></line>
</sc-for>
<sc-for list="{{ dots }}" as="p" hint-placeholder-count="57">
<circle cx="{{ p.x }}" cy="{{ p.y }}" r="2" fill="var(--neutral,#C9C8C2)"></circle>
</sc-for>
<path d="{{ avgPath }}" fill="none" stroke="var(--accent,#2F6C7A)" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"></path>
<line x1="26" y1="158" x2="328" y2="158" stroke="var(--disabled,#A3A29C)" strokeWidth="1.4" strokeDasharray="5 4"></line>
<text x="26" y="152" fill="var(--disabled,#A3A29C)" style="font-size:9px;font-family:'IBM Plex Sans',sans-serif;font-weight:500">Goal 100.0 kg — below this scale</text>
</svg>
</div>
<div style="display:flex;gap:14px;padding:4px 2px 0;flex-wrap:wrap">
<sc-for list="{{ legend }}" as="l" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:6px">
<div style="width:14px;height:{{ l.h }};border-radius:99px;background:{{ l.color }};border-top:{{ l.border }}"></div>
<span style="font-size:10.5px;font-weight:500;color:var(--muted,#6B6B66);white-space:nowrap">{{ l.label }}</span>
</div>
</sc-for>
</div>
</div>

<div style="margin:14px 18px 0;display:flex;flex-direction:column;gap:0">
<sc-for list="{{ insights }}" as="i" hint-placeholder-count="5">
<div style="display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line,#E6E5E0)">
<div style="width:22px;height:22px;flex:none;border-radius:99px;background:{{ i.bg }};color:{{ i.fg }};display:flex;align-items:center;justify-content:center;margin-top:1px">
<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="{{ i.icon }}" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"></path></svg>
</div>
<span style="flex:1;font-size:13.5px;font-weight:450;line-height:1.4;color:var(--text,#1C1C1A);text-wrap:pretty">{{ i.text }}</span>
</div>
</sc-for>
</div>
<div style="height:20px"></div>
</div>

<div style="flex:none;display:flex;padding:6px 4px 26px;background:var(--card,#fff);border-top:1px solid var(--line,#E6E5E0)">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
<div style="flex:1;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{ t.color }}">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="{{ t.icon }}" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"></path></svg>
<span style="font-size:10px;font-weight:{{ t.weight }}">{{ t.label }}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:790},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;offset&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:500,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
const TABS = [
  { label: 'Today', icon: 'M10 3.5v13M3.5 10h13' },
  { label: 'Progress', icon: 'M3 13.5l4-4.5 3 2.5 4-6 3 3.5' },
  { label: 'Trends', icon: 'M3.5 16.5V11m4.3 5.5V5m4.4 11.5V9m4.3 7.5v-13' },
  { label: 'Habits', icon: 'M3 3.5h5.5V9H3V3.5zM11.5 3.5H17V9h-5.5V3.5zM3 11.5h5.5V17H3v-5.5zM11.5 11.5H17V17h-5.5v-5.5z' },
  { label: 'More', icon: 'M4 10h.01M10 10h.01M16 10h.01' }
];
const ICO = {
  down: 'M8 3v9M4.5 8.5L8 12l3.5-3.5',
  rate: 'M2.5 12l4-4.5 3 2.5 4-6',
  goal: 'M8 2v12M8 2l6 2-6 2',
  steady: 'M2.5 8h11M11 5.5L13.5 8 11 10.5',
  habit: 'M3 8.5l3.5 3.5L13 5'
};
const WEEKLY = [156.8, 156.1, 155.4, 155.0, 154.3, 153.6, 152.9, 152.4];

class Component extends DCLogic {
  series() {
    const out = [];
    for (let i = 0; i < 57; i++) {
      const w = Math.min(7, Math.floor(i / 7));
      const base = WEEKLY[w];
      const next = WEEKLY[Math.min(7, w + 1)];
      const t = (i % 7) / 7;
      const trend = base + (next - base) * t * 0.85;
      out.push(Math.round((trend + Math.sin(i * 1.9) * 0.32 + Math.sin(i * 0.7) * 0.18) * 10) / 10);
    }
    out[56] = 152.2;
    return out;
  }

  renderVals() {
    const d = !!this.props.dark;
    const th = d
      ? { page: '#17181A', card: '#1F2124', line: '#2E3134', text: '#F0EFEC', muted: '#A0A09B', disabled: '#6E6E69', accent: '#5FA3B3', tint: '#22343A', green: '#4F8A6B', greenText: '#7FB995', greenTint: '#1E2A24', neutral: '#4A4B48', rail: '#2A2D30', onAccent: '#0F1112' }
      : { page: '#FAFAF8', card: '#FFFFFF', line: '#E6E5E0', text: '#1C1C1A', muted: '#6B6B66', disabled: '#A3A29C', accent: '#2F6C7A', tint: '#E3EFF2', green: '#4F8A6B', greenText: '#3E7057', greenTint: '#E4EFE8', neutral: '#C9C8C2', rail: '#EFEEE9', onAccent: '#FFFFFF' };
    const vars = Object.keys(th).map(k => '--' + k + ':' + th[k]).join(';') + ';--off:' + (-(this.props.offset || 0)) + 'px';

    const s = this.series();
    const lo = 151.8, hi = 157.6;
    const X = i => 30 + (i / 56) * 296;
    const Y = w => 12 + (1 - (w - lo) / (hi - lo)) * 126;
    const roll = s.map((v, i) => {
      const sl = s.slice(Math.max(0, i - 6), i + 1);
      return sl.reduce((a, b) => a + b, 0) / sl.length;
    });

    const spark = s.slice(-14);
    const sLo = Math.min.apply(null, spark) - 0.2, sHi = Math.max.apply(null, spark) + 0.2;
    const sparkPath = spark.map((v, i) => (i ? 'L' : 'M') + (2 + (i / 13) * 100).toFixed(1) + ' ' + (4 + (1 - (v - sLo) / (sHi - sLo)) * 34).toFixed(1)).join(' ');

    const ticks = [157, 155.5, 154, 152.5];

    return {
      vars,
      sparkPath,
      avgPath: roll.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' '),
      dots: s.map((v, i) => ({ x: X(i).toFixed(1), y: Y(v).toFixed(1) })),
      gridLines: ticks.map(t => ({ y: Y(t).toFixed(1) })),
      yLabels: ticks.map(t => ({ top: (Y(t) - 6).toFixed(1) + 'px', label: t.toFixed(1) })),
      legend: [
        { label: 'Daily weigh-in', color: th.neutral, h: '6px', border: '0' },
        { label: '7-day average', color: th.accent, h: '3px', border: '0' },
        { label: 'Goal', color: 'transparent', h: '0px', border: '1.4px dashed ' + th.disabled }
      ],
      stats: [
        { label: 'Total lost', value: '4.8', unit: 'kg', sub: '↓ since 13 Sept', color: th.greenText },
        { label: 'Remaining', value: '52.2', unit: 'kg', sub: 'To 100.0 kg', color: th.text },
        { label: 'Avg weekly loss', value: '0.6', unit: 'kg', sub: 'Over 8 weeks', color: th.text },
        { label: 'BMI', value: '48.0', unit: '', sub: 'Obesity class III', color: th.text },
        { label: 'Est. goal date', value: 'July', unit: '2028', sub: 'At the current rate', color: th.text },
        { label: '7-day consistency', value: '83', unit: '%', sub: '23-day weigh-in streak', color: th.text }
      ],
      insights: [
        { text: 'You lost 0.5 kg this week — keep it up.', icon: ICO.down, bg: th.greenTint, fg: th.greenText },
        { text: 'Averaging 0.6 kg per week over the last 8 weeks.', icon: ICO.rate, bg: th.tint, fg: th.accent },
        { text: 'Projected to reach your goal in about 87 weeks (July 2028).', icon: ICO.goal, bg: th.tint, fg: th.accent },
        { text: 'Your rate is steady compared with last month.', icon: ICO.steady, bg: th.tint, fg: th.accent },
        { text: 'Habit consistency over the last 7 days: 83%.', icon: ICO.habit, bg: th.tint, fg: th.accent }
      ],
      tabs: TABS.map(t => ({ label: t.label, icon: t.icon, color: t.label === 'Progress' ? th.accent : th.disabled, weight: t.label === 'Progress' ? 600 : 500 }))
    };
  }
}
</script>
</body>
</html>
